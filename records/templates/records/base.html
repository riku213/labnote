<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}labnote{% endblock %}</title>
<style>
body { font-family: sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; line-height: 1.6; }
nav a { margin-right: 1rem; }
table { border-collapse: collapse; margin: 1rem 0; }
th, td { border: 1px solid #ccc; padding: 0.3rem 0.6rem; text-align: right; }
th { background: #f0f0f0; text-align: center; }
td.label, th.label { text-align: left; }
.best { font-weight: bold; background: #eaffea; }
.messages { list-style: none; padding: 0; }
.messages li { border: 1px solid #999; padding: 0.4rem 0.8rem; margin: 0.3rem 0; }
pre { white-space: pre-wrap; background: #fafafa; padding: 0.8rem; }
img.att { max-width: 100%; }
</style>
</head>
<body>
<nav>
<a href="{% url 'records:home' %}">ホーム</a>
<a href="{% url 'records:experiment_list' %}">実験</a>
<a href="{% url 'records:experiment_compare' %}">実験を比較</a>
<a href="{% url 'records:import_yaml' %}">YAML取り込み</a>
<a href="{% url 'records:note_list' %}">ノート</a>
<a href="{% url 'records:reading_list' %}">読書記録</a>
</nav>
{% if messages %}<ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</body>
</html>
