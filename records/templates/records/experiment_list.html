{% extends 'records/base.html' %}
{% block content %}
<h1>実験一覧</h1>
<p><a href="{% url 'records:experiment_create' %}">手入力で登録</a> / <a href="{% url 'records:import_yaml' %}">YAMLから取り込む</a></p>
<table>
<tr><th class="label">日付</th><th class="label">ID</th><th class="label">タイトル</th><th>指標の件数</th></tr>
{% for e in experiments %}
<tr><td class="label">{{ e.date }}</td><td class="label">{{ e.code }}</td>
<td class="label"><a href="{% url 'records:experiment_detail' e.pk %}">{{ e.title }}</a></td>
<td>{{ e.metrics.count }}</td></tr>
{% empty %}<tr><td colspan="4">まだ実験が登録されていません</td></tr>{% endfor %}
</table>
{% endblock %}
