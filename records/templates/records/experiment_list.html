{% extends 'records/base.html' %}
{% block content %}
<h1>実験一覧</h1>
<p><a class="btn secondary" href="{% url 'records:experiment_create' %}">手入力で登録</a>
<a class="btn secondary" href="{% url 'records:import_yaml' %}">YAMLから取り込む</a></p>
<table>
<thead><tr><th>日付</th><th>ID</th><th>タイトル</th><th class="num">評価値の件数</th></tr></thead>
<tbody>
{% for e in experiments %}
<tr><td>{{ e.date }}</td><td>{{ e.code }}</td>
<td><a href="{% url 'records:experiment_detail' e.pk %}">{{ e.title }}</a></td>
<td class="num">{{ e.values.count }}</td></tr>
{% empty %}<tr><td colspan="4">まだ実験が登録されていません</td></tr>{% endfor %}
</tbody>
</table>
{% endblock %}
